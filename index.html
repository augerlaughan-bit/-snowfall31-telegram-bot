<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNOWFALL 31 - Produits Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: #0b1329;
            --border-color: #1e293b;
            --accent-green: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 120px;
        }

        /* Top Header & Logo */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--accent-green);
        }

        .brand-title {
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff;
        }

        .brand-subtitle {
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .cart-icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 12px;
            color: var(--accent-green);
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        /* Rating Banner */
        .rating-banner {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 0.85rem;
        }

        .rating-score {
            color: #fbbf24;
            font-weight: 800;
            font-size: 1rem;
        }

        .review-link {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-decoration: underline;
            cursor: pointer;
        }

        /* Categories */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .cat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .cat-card.active {
            border-color: var(--accent-green);
            background: var(--accent-glow);
        }

        .cat-card img {
            width: 100%;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .cat-name {
            font-size: 0.75rem;
            font-weight: 700;
            color: #fff;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .product-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .product-item:active {
            transform: scale(0.97);
        }

        .product-item img {
            width: 100%;
            height: 110px;
            object-fit: cover;
        }

        .product-item-info {
            padding: 10px;
        }

        .product-item-name {
            font-size: 0.85rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-item-tag {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        /* Modal Details Produit & Panier */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.9);
            z-index: 2000;
            overflow-y: auto;
            padding: 16px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            max-width: 500px;
            margin: 20px auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .detail-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .detail-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 16px;
        }

        /* Price Tiers */
        .price-tier {
            background: #050b18;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .price-info {
            font-size: 0.9rem;
            font-weight: 800;
            color: #fff;
        }

        .tier-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tier-btn {
            background: var(--border-color);
            border: none;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .tier-qty {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent-green);
            min-width: 15px;
            text-align: center;
        }

        /* Cart & Checkout Form Styles */
        .cart-section-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
            margin: 14px 0 8px 0;
        }

        .delivery-modes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .mode-btn {
            background: #050b18;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 6px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
        }

        .mode-btn.active {
            background: var(--accent-glow);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .form-input {
            width: 100%;
            background: #050b18;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 10px;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--accent-green);
        }

        .payment-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .pay-btn {
            background: #050b18;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
        }

        .pay-btn.active {
            background: var(--accent-glow);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .btn-main {
            width: 100%;
            background: var(--accent-green);
            color: #030712;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        /* Navigation Bar Bottom */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #030712;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            background: none;
            border: none;
        }

        .nav-item.active {
            color: var(--accent-green);
        }
    </style>
</head>
<body>

    <!-- TOP HEADER -->
    <div class="app-header">
        <div class="brand-box">
            <!-- Remplacez le lien ci-dessous par l'URL de votre logo -->
            <img src="https://images.unsplash.com/photo-1550989460-0adf9ea622e2?w=100&auto=format&fit=crop&q=60" alt="Logo" class="brand-logo">
            <div>
                <div class="brand-title">SNOWFALL 31</div>
                <div class="brand-subtitle">PRODUITS PREMIUM</div>
            </div>
        </div>
        <div class="cart-icon-btn" onclick="openCartModal()">
            🛒 <span id="cart-counter">0</span>
        </div>
    </div>

    <!-- RATING -->
    <div class="rating-banner">
        <div>
            <span class="rating-score">8.0</span> <span style="color:var(--text-muted);">★ 1 avis client</span>
        </div>
        <div class="review-link" onclick="alert('Fonctionnalité d\'avis client')">Voir et laisser un avis</div>
    </div>

    <!-- CATEGORIES -->
    <div class="categories-grid">
        <div class="cat-card active" onclick="filterCat('all', this)">
            <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=200&auto=format&fit=crop&q=60" alt="Hash">
            <div class="cat-name">HASH</div>
        </div>
        <div class="cat-card" onclick="filterCat('weed', this)">
            <img src="https://images.unsplash.com/photo-1550989460-0adf9ea622e2?w=200&auto=format&fit=crop&q=60" alt="Weed">
            <div class="cat-name">WEED</div>
        </div>
        <div class="cat-card" onclick="filterCat('extraction', this)">
            <img src="https://images.unsplash.com/photo-1526318896980-cf78c08b2470?w=200&auto=format&fit=crop&q=60" alt="Extraction">
            <div class="cat-name">EXTRACTION</div>
        </div>
    </div>

    <!-- CATALOGUE PRODUITS -->
    <div class="section-title">Tous les produits (<span id="prod-count">4</span>)</div>
    <div class="products-grid" id="product-list">
        <!-- Produits injectés par JS -->
    </div>

    <!-- MODAL PRODUIT / DETAIL -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-product-name" style="color:#fff; font-size:1rem;">Détails</h3>
                <button class="close-btn" onclick="closeModals()">✕</button>
            </div>
            <img id="modal-product-img" class="detail-img" src="" alt="">
            <div id="modal-product-desc" class="detail-desc"></div>
            
            <div class="section-title">Choisissez vos formats :</div>
            <div id="modal-tiers-container"></div>
            
            <button class="btn-main" style="margin-top:16px;" onclick="openCartModalFromDetail()">VOIR LE PANIER ➔</button>
        </div>
    </div>

    <!-- MODAL PANIER & COMMANDE -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="color:#fff; font-size:1rem;">Mon Panier</h3>
                <button class="close-btn" onclick="closeModals()">✕</button>
            </div>
            
            <div id="cart-items-container" style="margin-bottom:12px;">
                <!-- Articles du panier -->
            </div>

            <div style="display:flex; justify-content:space-between; font-weight:800; font-size:0.95rem; margin-bottom:14px; border-top:1px solid var(--border-color); padding-top:10px;">
                <span>Total estimé :</span>
                <span id="cart-total" style="color:var(--accent-green);">0 €</span>
            </div>

            <button onclick="clearCart()" style="background:none; border:none; color:#ef4444; font-size:0.75rem; font-weight:700; cursor:pointer; margin-bottom:14px;">🗑 Vider le panier</button>

            <div class="cart-section-title">Mode de livraison :</div>
            <div class="delivery-modes">
                <div class="mode-btn active" onclick="setDeliveryMode('Meet-up', this)">Meet-up</div>
                <div class="mode-btn" onclick="setDeliveryMode('Livraison', this)">Livraison</div>
                <div class="mode-btn" onclick="setDeliveryMode('Colis', this)">Colis</div>
            </div>

            <!-- Champs dynamiques selon livraison -->
            <div id="delivery-fields">
                <input type="text" id="field-address" class="form-input" placeholder="📍 Adresse exacte...">
                <input type="text" id="field-building" class="form-input" placeholder="🏢 Bâtiment / résidence (optionnel)">
            </div>

            <div class="cart-section-title">Vos informations :</div>
            <input type="text" id="field-firstname" class="form-input" placeholder="Prénom">
            <input type="text" id="field-lastname" class="form-input" placeholder="Nom">
            <input type="text" id="field-phone" class="form-input" placeholder="📱 Téléphone / WhatsApp (optionnel)">
            <input type="text" id="field-telegram" class="form-input" placeholder="✈️ @votre_pseudo (OBLIGATOIRE)">

            <div class="cart-section-title">Mode de paiement :</div>
            <div class="payment-grid">
                <div class="pay-btn active" onclick="setPaymentMode('Espèces', this)">Espèces 💶</div>
                <div class="pay-btn" onclick="setPaymentMode('Crypto', this)">Crypto 🪙</div>
            </div>

            <button class="btn-main" onclick="sendOrderTelegram()">COMMANDER SUR TELEGRAM ➔</button>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="closeModals()">
            <div>🏠</div> Menu
        </button>
        <button class="nav-item" onclick="alert('Contactez notre support via le bot Telegram officiel.')">
            <div>💬</div> Contact
        </button>
    </div>

    <script>
        // --- BASE DE DONNÉES PRODUITS ---
        const products = [
            {
                id: 1,
                category: 'hash',
                name: 'SIMPSON',
                tag: 'Maroc 🇲🇦',
                image: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500&auto=format&fit=crop&q=60',
                desc: 'SIMPSON 🇲🇦 Un profil gourmand, crémeux et légèrement terreux. Au nez, on retrouve des notes de biscuit, crème, épices douces et noisette.',
                tiers: [
                    { weight: '100G', price: 280 },
                    { weight: '200G', price: 550 },
                    { weight: '500G', price: 1280 },
                    { weight: '1KG', price: 2400 }
                ]
            },
            {
                id: 2,
                category: 'hash',
                name: 'JAUNE MOUSSEUX',
                tag: 'Sélection Spéciale 🍯',
                image: 'https://images.unsplash.com/photo-1550989460-0adf9ea622e2?w=500&auto=format&fit=crop&q=60',
                desc: 'Jaune Mousseux classique et soigneusement filtré. Texture mousseuse et arômes prononcés.',
                tiers: [
                    { weight: '100G', price: 250 },
                    { weight: '250G', price: 580 },
                    { weight: '500G', price: 1100 },
                    { weight: '1KG', price: 2100 }
                ]
            },
            {
                id: 3,
                category: 'weed',
                name: 'CALI PURPLE US',
                tag: 'USA 🇺🇸',
                image: 'https://images.unsplash.com/photo-1526318896980-cf78c08b2470?w=500&auto=format&fit=crop&q=60',
                desc: 'Fleurs Cali d’exception aux notes fruitées et à forte teneur en trichomes.',
                tiers: [
                    { weight: '10G', price: 100 },
                    { weight: '25G', price: 220 },
                    { weight: '50G', price: 400 },
                    { weight: '100G', price: 750 }
                ]
            },
            {
                id: 4,
                category: 'extraction',
                name: '120U DRY SIFT',
                tag: 'Premium 💎',
                image: 'https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?w=500&auto=format&fit=crop&q=60',
                desc: 'Extraction haut de gamme tamisée à 120 microns. Pureté et puissance garanties.',
                tiers: [
                    { weight: '25G', price: 180 },
                    { weight: '50G', price: 340 },
                    { weight: '100G', price: 650 },
                    { weight: '250G', price: 1500 }
                ]
            }
        ];

        let cart = []; // Structure: {productName, weight, price, qty}
        let currentDeliveryMode = 'Meet-up';
        let currentPaymentMode = 'Espèces';

        // --- AFFICHAGE PRODUITS ---
        function renderProducts(cat = 'all') {
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            
            const filtered = cat === 'all' ? products : products.filter(p => p.category === cat);
            document.getElementById('prod-count').textContent = filtered.length;

            filtered.forEach(p => {
                list.innerHTML += `
                    <div class="product-item" onclick="openProduct(${p.id})">
                        <img src="${p.image}" alt="${p.name}">
                        <div class="product-item-info">
                            <div class="product-item-name">${p.name}</div>
                            <div class="product-item-tag">${p.tag}</div>
                        </div>
                    </div>
                `;
            });
        }

        function filterCat(cat, element) {
            document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            renderProducts(cat);
        }

        // --- GESTION MODALE PRODUIT ---
        function openProduct(id) {
            const p = products.find(prod => prod.id === id);
            document.getElementById('modal-product-name').textContent = p.name;
            document.getElementById('modal-product-img').src = p.image;
            document.getElementById('modal-product-desc').textContent = p.desc;

            const tiersContainer = document.getElementById('modal-tiers-container');
            tiersContainer.innerHTML = '';

            p.tiers.forEach(tier => {
                let existingItem = cart.find(item => item.productName === p.name && item.weight === tier.weight);
                let qty = existingItem ? existingItem.qty : 0;

                tiersContainer.innerHTML += `
                    <div class="price-tier">
                        <div class="price-info">${tier.weight} — ${tier.price}€</div>
                        <div class="tier-controls">
                            <button class="tier-btn" onclick="updateQty('${p.name}', '${tier.weight}', ${tier.price}, -1)">-</button>
                            <span class="tier-qty" id="qty-${p.name}-${tier.weight}">${qty}</span>
                            <button class="tier-btn" onclick="updateQty('${p.name}', '${tier.weight}', ${tier.price}, 1)">+</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('productModal').style.display = 'block';
        }

        function updateQty(productName, weight, price, change) {
            let item = cart.find(i => i.productName === productName && i.weight === weight);
            
            if (item) {
                item.qty += change;
                if (item.qty <= 0) {
                    cart = cart.filter(i => !(i.productName === productName && i.weight === weight));
                    item = null;
                }
            } else if (change > 0) {
                cart.push({ productName, weight, price, qty: change });
            }

            let qtySpan = document.getElementById(`qty-${productName}-${weight}`);
            if (qtySpan) {
                let currentItem = cart.find(i => i.productName === productName && i.weight === weight);
                qtySpan.textContent = currentItem ? currentItem.qty : 0;
            }

            updateCartCounter();
        }

        function updateCartCounter() {
            let totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cart-counter').textContent = totalItems;
        }

        // --- GESTION PANIER ---
        function openCartModal() {
            renderCartItems();
            document.getElementById('productModal').style.display = 'none';
            document.getElementById('cartModal').style.display = 'block';
        }

        function openCartModalFromDetail() {
            openCartModal();
        }

        function closeModals() {
            document.getElementById('productModal').style.display = 'none';
            document.getElementById('cartModal').style.display = 'none';
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items-container');
            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = '<div style="color:var(--text-muted); font-size:0.85rem; text-align:center; padding:10px;">Votre panier est vide</div>';
                document.getElementById('cart-total').textContent = '0 €';
                return;
            }

            let totalSum = 0;
            cart.forEach(item => {
                let itemTotal = item.price * item.qty;
                totalSum += itemTotal;

                container.innerHTML += `
                    <div style="display:flex; justify-content:space-between; align-items:center; background:#050b18; padding:8px 10px; border-radius:8px; margin-bottom:6px; font-size:0.85rem;">
                        <div><b>${item.productName}</b> (${item.weight})</div>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span style="color:var(--accent-green); font-weight:700;">${itemTotal}€</span>
                            <button onclick="updateQtyDirect('${item.productName}', '${item.weight}', -1)" style="background:none; border:none; color:#ef4444; font-weight:bold; cursor:pointer;">-</button>
                            <span>${item.qty}</span>
                            <button onclick="updateQtyDirect('${item.productName}', '${item.weight}', 1)" style="background:none; border:none; color:var(--accent-green); font-weight:bold; cursor:pointer;">+</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('cart-total').textContent = totalSum + ' €';
        }

        function updateQtyDirect(productName, weight, change) {
            let item = cart.find(i => i.productName === productName && i.weight === weight);
            if (item) {
                item.qty += change;
                if (item.qty <= 0) {
                    cart = cart.filter(i => !(i.productName === productName && i.weight === weight));
                }
            }
            renderCartItems();
            updateCartCounter();
        }

        function clearCart() {
            cart = [];
            renderCartItems();
            updateCartCounter();
        }

        function setDeliveryMode(mode, element) {
            currentDeliveryMode = mode;
            document.querySelectorAll('.delivery-modes .mode-btn').forEach(b => b.classList.remove('active'));
            element.classList.add('active');

            const fieldsContainer = document.getElementById('delivery-fields');
            if (mode === 'Colis') {
                fieldsContainer.innerHTML = `
                    <select id="field-carrier" class="form-input">
                        <option value="Mondial Relais">📦 Mondial Relais (3-5 jours ouvrés)</option>
                        <option value="Chronopost">⚡ Chronopost (24h)</option>
                    </select>
                    <input type="text" id="field-address" class="form-input" placeholder="📍 Adresse complète de point relais ou domicile...">
                `;
            } else {
                fieldsContainer.innerHTML = `
                    <input type="text" id="field-address" class="form-input" placeholder="📍 Adresse exacte de livraison...">
                    <input type="text" id="field-building" class="form-input" placeholder="🏢 Bâtiment / résidence (optionnel)">
                `;
            }
        }

        function setPaymentMode(mode, element) {
            currentPaymentMode = mode;
            document.querySelectorAll('.payment-grid .pay-btn').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
        }

        // --- VALIDATION COMMANDE TELEGRAM ---
        function sendOrderTelegram() {
            if (cart.length === 0) {
                alert("Votre panier est vide !");
                return;
            }

            const telegramId = document.getElementById('field-telegram').value.trim();
            const firstname = document.getElementById('field-firstname').value.trim();
            const address = document.getElementById('field-address').value.trim();

            if (!telegramId) {
                alert("Veuillez renseigner votre pseudo Telegram (ex: @votre_pseudo) !");
                return;
            }
            if (!address) {
                alert("Veuillez renseigner votre adresse !");
                return;
            }

            let itemsText = cart.map(i => `• ${i.productName} (${i.weight}) x${i.qty} = ${i.price * i.qty}€`).join('\n');
            let totalSum = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

            let deliveryDetails = currentDeliveryMode === 'Colis' ? 
                `• Transporteur : ${document.getElementById('field-carrier').value}` : 
                `• Bâtiment/Résidence : ${document.getElementById('field-building').value || 'Non renseigné'}`;

            const message = `🛍 *NOUVELLE COMMANDE - SNOWFALL 31*
------------------
${itemsText}
------------------
💰 *Total :* ${totalSum}€
🚚 *Mode :* ${currentDeliveryMode}
📍 *Adresse :* ${address}
${deliveryDetails}
👤 *Client :* ${firstname} ${document.getElementById('field-lastname').value}
📱 *Contact :* ${document.getElementById('field-phone').value || 'Non renseigné'}
✈️ *Telegram :* ${telegramId}
💳 *Paiement :* ${currentPaymentMode}`;

            const botUsername = "Snow31_bot"; // Changez ici si besoin par le nom de votre bot
            const url = `https://t.me/${botUsername}?text=${encodeURIComponent(message)}`;

            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.openTelegramLink(url);
            } else {
                window.location.href = url;
            }
        }

        // Initialisation du catalogue
        renderProducts();
    </script>
</body>
</html>
