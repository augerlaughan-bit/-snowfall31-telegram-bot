<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snowfall31 - Catalogue</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #f59e0b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }
        header {
            text-align: center;
            margin-bottom: 24px;
        }
        header h1 {
            color: var(--accent-color);
            margin: 0 0 8px 0;
            font-size: 24px;
        }
        header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 14px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }
        .card h3 {
            margin: 0 0 8px 0;
            font-size: 18px;
        }
        .card p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0 0 12px 0;
        }
        .footer-price {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .price {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 16px;
        }
        .btn {
            background-color: var(--accent-color);
            color: #000;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>SNOWFALL31</h1>
        <p>Catalogue Officiel & Tarifs</p>
    </header>

    <div class="container">
        <!-- Article 1 -->
        <div class="card">
            <h3>Nom du Produit / Service 1</h3>
            <p>Description rapide de ton produit ou de ta prestation de qualité supérieure sur Toulouse.</p>
            <div class="footer-price">
                <span class="price">XX €</span>
                <a href="https://t.me/TON_PSEUDO" class="btn">Commander</a>
            </div>
        </div>

        <!-- Article 2 -->
        <div class="card">
            <h3>Nom du Produit / Service 2</h3>
            <p>Description rapide de ton deuxième produit ou formule disponible.</p>
            <div class="footer-price">
                <span class="price">XX €</span>
                <a href="https://t.me/TON_PSEUDO" class="btn">Commander</a>
            </div>
        </div>
    </div>

</body>
</html>
