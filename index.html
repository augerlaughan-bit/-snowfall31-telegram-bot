<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNOWFALL31 - Menu</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            padding-bottom: 140px;
        }
        h1, h2 {
            font-size: 1.2rem;
            color: #58a6ff;
        }
        .section-box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #fff;
            border-radius: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        button.btn-add {
            background: #238636;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        #cart-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #161b22;
            border-top: 1px solid #30363d;
            padding: 15px;
            box-sizing: border-box;
        }
        .btn-order {
            background: #1f6feb;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Élément audio unique -->
    <audio id="bg-music" loop></audio>

    <h1>SNOWFALL31 - Menu</h1>

    <!-- SECTION CHOIX DE LA MUSIQUE -->
    <div class="section-box">
        <label for="music-select">🎵 <b>Ambiance sonore :</b></label>
        <select id="music-select" onchange="changeMusic()">
            <option value="">-- Couper la musique --</option>
            <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">Ambiance Chill Trap</option>
            <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">Ambiance Dark / Lofi</option>
            <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3">Ambiance Rap / Hip-Hop</option>
        </select>
    </div>

    <!-- PRODUIT 1 -->
    <div class="section-box">
        <h3>Jaune Mousseux (HASH 🍯)</h3>
        <select id="qty-1">
            <option value="1g - 10€">1g = 10€</option>
            <option value="5g - 45€">5g = 45€</option>
            <option value="10g - 80€">10g = 80€</option>
        </select>
        <button class="btn-add" onclick="selectProduct('Jaune Mousseux', 'qty-1')">Sélectionner ce produit</button>
    </div>

    <!-- PRODUIT 2 -->
    <div class="section-box">
        <h3>73U Super Dry (HASH 🇨🇦)</h3>
        <select id="qty-2">
            <option value="1g - 15€">1g = 15€</option>
            <option value="10g - 130€">10g = 130€</option>
        </select>
        <button class="btn-add" onclick="selectProduct('73U Super Dry', 'qty-2')">Sélectionner ce produit</button>
    </div>

    <!-- PANIER & VALIDATION -->
    <div id="cart-container">
        <p id="current-selection" style="margin: 0 0 10px 0; font-size: 0.9rem; color: #8b949e;">Aucun article sélectionné</p>
        <input type="text" id="delivery-address" placeholder="Adresse exacte de livraison...">
        <button class="btn-order" onclick="sendOrder()">Commander sur Telegram ➔</button>
    </div>

    <script>
        // --- GESTION DU CHOIX DE LA MUSIQUE ---
        function changeMusic() {
            const select = document.getElementById('music-select');
            const music = document.getElementById('bg-music');
            const selectedUrl = select.value;

            if (selectedUrl === "") {
                music.pause();
                music.src = "";
            } else {
                music.src = selectedUrl;
                music.volume = 0.3;
                music.play().catch(error => {
                    console.log("Lecture bloquée ou ignorée :", error);
                });
            }
        }

        // --- GESTION PANIER ET COMMANDE ---
        let chosenItem = "";
        let chosenPrice = "";

        function selectProduct(productName, selectId) {
            const selectElement = document.getElementById(selectId);
            chosenItem = productName;
            chosenPrice = selectElement.value;

            document.getElementById('current-selection').innerHTML = `✅ <b>${chosenItem}</b> (${chosenPrice})`;
            document.getElementById('current-selection').style.color = '#3fb950';
        }

        function sendOrder() {
            const address = document.getElementById('delivery-address').value.trim();

            if (!chosenItem) {
                alert("Veuillez sélectionner un produit et son grammage !");
                return;
            }
            if (!address) {
                alert("Veuillez indiquer votre adresse de livraison !");
                return;
            }

            const message = `🛍️ *Nouvelle Commande*
------------------
• *Produit :* ${chosenItem}
• *Format :* ${chosenPrice}
• *Mode :* Livraison 🚚
• *Adresse :* ${address}`;

            const botUsername = "VOTRE_BOT_USERNAME"; // Remplacez par le username de votre bot
            const url = `https://t.me/${botUsername}?text=${encodeURIComponent(message)}`;

            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.openTelegramLink(url);
            } else {
                window.location.href = url;
            }
        }
    </script>
</body>
</html>
